version: '3.8'

services:
  nkinvoice-test:
    build: .
    container_name: nkinvoice-test
    environment:
      - OPUS_USER=${OPUS_USER}
      - OPUS_USER_PASSWORD=${OPUS_USER_PASSWORD}
      - OPUS_URL=${OPUS_URL}
      - OPUS_MUNICIPALITY_CODE=${OPUS_MUNICIPALITY_CODE}
      - DISPLAY=:99
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
    volumes:
      # Mount current directory to container for development
      - .:/app
      # Mount logs directory for persistent logging
      - ./logs:/app/logs
      # Mount tmp directory for temporary files
      - ./tmp:/app/tmp
    env_file:
      - .env
    # Override the default command to run tests
    command: uv run python sample.py
    # Add restart policy for development
    restart: "no"
    # Add network mode for better isolation
    network_mode: "bridge"
    # Add security options for Playwright
    security_opt:
      - seccomp:unconfined
    # Add shared memory for browser processes
    shm_size: 2gb
    # Add capabilities for browser automation
    cap_add:
      - SYS_ADMIN

  # Optional: Add a service for running tests in headless mode
  nkinvoice-headless:
    build: .
    container_name: nkinvoice-headless
    environment:
      - OPUS_USER=${OPUS_USER}
      - OPUS_USER_PASSWORD=${OPUS_USER_PASSWORD}
      - OPUS_URL=${OPUS_URL}
      - OPUS_MUNICIPALITY_CODE=${OPUS_MUNICIPALITY_CODE}
      - DISPLAY=:99
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    env_file:
      - .env
    command: >
      uv run python -c "
      import os
      os.environ['HEADLESS'] = 'true'
      exec(open('sample.py').read())
      "
    restart: "no"
    network_mode: "bridge"
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN
