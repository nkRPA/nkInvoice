version: '3.8'

services:
  nkinvoice-test:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    container_name: nkinvoice-test-ubuntu
    environment:
      - OPUS_USER=${OPUS_USER}
      - OPUS_USER_PASSWORD=${OPUS_USER_PASSWORD}
      - OPUS_URL=${OPUS_URL}
      - OPUS_MUNICIPALITY_CODE=${OPUS_MUNICIPALITY_CODE}
      - DISPLAY=:99
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      # Mount current directory to container for development
      - .:/app
      # Mount logs directory for persistent logging
      - ./logs:/app/logs
      # Mount tmp directory for temporary files
      - ./tmp:/app/tmp
    env_file:
      - .env
    # Override the default command to run tests
    command: >
      sh -c "
        # Start virtual display for headless operation
        Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
        # Wait for display to start
        sleep 2
        # Run the test
        python sample.py
      "
    # Add restart policy for development
    restart: "no"
    # Add network mode for better isolation
    network_mode: "bridge"
    # Add security options for Playwright
    security_opt:
      - seccomp:unconfined
    # Add shared memory for browser processes
    shm_size: 2gb
    # Add capabilities for browser automation
    cap_add:
      - SYS_ADMIN

  # Headless service optimized for Ubuntu server
  nkinvoice-headless:
    build:
      context: .
      dockerfile: Dockerfile.ubuntu
    container_name: nkinvoice-headless-ubuntu
    environment:
      - OPUS_USER=${OPUS_USER}
      - OPUS_USER_PASSWORD=${OPUS_USER_PASSWORD}
      - OPUS_URL=${OPUS_URL}
      - OPUS_MUNICIPALITY_CODE=${OPUS_MUNICIPALITY_CODE}
      - DISPLAY=:99
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    env_file:
      - .env
    command: >
      sh -c "
        # Start virtual display
        Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset &
        # Wait for display
        sleep 2
        # Set headless mode and run
        python -c \"
import os
os.environ['HEADLESS'] = 'true'
exec(open('sample.py').read())
\"
      "
    restart: "no"
    network_mode: "bridge"
    security_opt:
      - seccomp:unconfined
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN
