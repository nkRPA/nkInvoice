[tool.setuptools]
include-package-data = true
[project]
name = "nkinvoice"
version = "0.3.2"
description = "Invoice using playwright"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "playwright>=1.55.0",
    "pydantic>=2.11.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
 